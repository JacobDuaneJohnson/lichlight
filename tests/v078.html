    check('torch cone draw', !!(fa && fb && sumRgb(fa) > 150 && sumRgb(fb) + 80 < sumRgb(fa)), 'face ' + pair[0].join(',') + ' ' + (fa && fa.join(',')) + ' / ' + (fb && fb.join(',')));
  } else check('torch cone draw', false, 'no open pair');
  const bloom = w.document.querySelector('#glDevRows input[data-k="bloomK"]');
  const bloomR = w.document.querySelector('#glDevRows input[data-k="bloomR"]');
  bloom.value = '2'; bloom.dispatchEvent(new Event('input'));
  bloomR.value = '1.5'; bloomR.dispatchEvent(new Event('input'));
  check('bloom dials', g.glLook().bloomK === 2 && Math.abs(g.glLook().bloomR - 1.5) < 0.001, g.glLook().bloomK + ' ' + g.glLook().bloomR);
  const n0 = w.visPoly(16, 16, 30, 40).length;
  const ray = w.document.querySelector('#glDevRows input[data-k="rayMul"]');
  ray.value = '2'; ray.dispatchEvent(new Event('input'));
  const n1 = w.visPoly(16, 16, 30, 40).length;
  check('ray mul', n1 === n0 * 2, n0 + ' -> ' + n1);
  const c0 = w.cachedPoly('devt', 48, 48, 24, 20);
  const bite = w.document.querySelector('#glDevRows input[data-k="bite"]');
  bite.value = '28'; bite.dispatchEvent(new Event('input'));
  const c1 = w.cachedPoly('devt', 48, 48, 24, 20);
  check('vis cache', c0 !== c1);
  const outl = w.document.querySelector('#glDevRows input[data-k="outline"]');
  outl.checked = true; outl.dispatchEvent(new Event('change'));
  check('outline on', g.glLook().outline === 1);
  w.render();
  check('outline draw', g.glLook().outline === 1);
  g.settings.lighting = 'low';
  w.syncGlDev();
  const pen = w.document.querySelector('#glDevRows input[data-k="penumbra"]');
  check('dev grey on canvas', !!(pen && pen.disabled && !bloom.disabled && seenPick && !seenPick.disabled && voidPick && !voidPick.disabled && w.document.getElementById('glDevNote').textContent.indexOf('Canvas') >= 0), w.document.getElementById('glDevNote').textContent);
  g.settings.lighting = 'high';
  g.settings.glLight = 'on';
  w.render();
  w.syncGlDev();
  check('dev live path', pen && !pen.disabled && g.lightPath() === 'webgl', g.lightPath() + ' disabled=' + (pen && pen.disabled));
  pen.value = '21';
  pen.dispatchEvent(new Event('input'));
  check('dev slider', g.glLook().penumbra === 21 && pen.parentNode.querySelector('b').textContent === '21', g.glLook().penumbra);
  w.document.getElementById('glDevReset').click();
  const dflt = g.glLookDefaults();
  check('dev reset', g.glLook().penumbra === dflt.penumbra && g.glLook().fill === dflt.fill && g.glLook().armFall === 1 && g.glLook().armCone === 360 && g.glLook().armR === 110 && g.glLook().thFall === 1 && g.glLook().thCone === 360 && g.glLook().thR === 255 && g.glLook().thG === 190 && g.glLook().envB === 1 && g.glLook().envFall === 1 && g.glLook().bands === 0 && g.glLook().bloomK === 1 && g.glLook().rayMul === 1 && g.glLook().bite === 10 && g.glLook().biteN === 8 && g.glLook().bandOff === 6 && g.glLook().outline === 0 && g.glLook().voidR === 5 && g.glLook().seenR === 26 && g.glLook().seenB === 32 && pen.value === '12' && seenPick.parentNode.querySelector('b').textContent === '#1A1520' && armPick.parentNode.querySelector('b').textContent === '#6E606E' && Math.abs(box.getBoundingClientRect().width - 440) < 3, g.glLook().armCone + '/' + g.glLook().thCone);
  g.settings.glLight = 'auto';
}
