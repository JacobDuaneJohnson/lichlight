<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>v078-play</title></head>
<body>
<iframe id="g" src="../index.html" style="width:960px;height:540px"></iframe>
<pre id="out">running</pre>
<script>
const lines = [];
function check(name, cond, extra) {
  lines.push((cond ? 'PASS' : 'FAIL') + ' ' + name + (extra ? ' :: ' + String(extra).slice(0, 320) : ''));
}
function finish() {
  const fails = lines.filter(l => l.startsWith('FAIL')).length;
  document.getElementById('out').textContent = lines.join('\n');
  document.title = (fails ? 'FAIL ' + fails : 'PASS') + ' / ' + lines.length;
  const fr = document.getElementById('g'); if (fr) fr.remove();
}
document.getElementById('g').addEventListener('load', () => {
  try { run(document.getElementById('g').contentWindow); }
  catch (e) { lines.push('FAIL harness :: ' + (e && e.stack || e)); }
  finish();
});
function doorNearSpawn(w, g) {
  const s = g.rooms[0];
  return (g.doors || []).some(d => d.tiles.some(t => {
    if (t.x >= s.x - 1 && t.x <= s.x + s.w && t.y >= s.y - 1 && t.y <= s.y + s.h) return true;
    return Math.hypot(t.x - s.cx, t.y - s.cy) < 8;
  }));
}
function bossChain(g) {
  const blood = (g.doors || []).find(d => d.kind === 'blood');
  const puzzle = (g.doors || []).find(d => d.bossGate && d.puzzle);
  const boss = (g.enemies || []).find(e => e.T && e.T.boss);
  const room = (g.rooms || []).find(r => r.bossRoom);
  return { blood, puzzle, boss, room };
}
function run(w) {
  const g = w.game;
  w.__noSampleSfx = true;
  check('boot', !!(g && g.newGame && g.lichDevOn));
  check('gate still pages', g.lichDevOn('gamedevjake.github.io', '?lichDev=1') === false && g.lichDevOn('localhost') === true);

  // F4 books
  g.newGame();
  let booksEarly = 0;
  for (let d = 1; d <= 5; d++) { g.startFloor(d, true); if ((g.books || []).length) booksEarly++; }
  check('f4 no books 1-5', booksEarly === 0, booksEarly);
  g.player.learned = [false, false, false];
  g.startFloor(6, true);
  check('f4 book at 6', (g.books || []).length === 1 && g.books[0].skill === 0, (g.books || []).map(b => b.skill).join(','));

  // F1 doors + B2 entrance + layout sample
  let doorBad = 0, spawnMobs = 0, floors = 0;
  for (let d = 1; d <= 8; d++) {
    g.startFloor(d, true); floors++;
    if (doorNearSpawn(w, g)) doorBad++;
    const s = g.rooms[0];
    const mobs = g.enemies.filter(e => {
      const tx = Math.floor(e.x / 16), ty = Math.floor(e.y / 16);
      return tx >= s.x - 1 && tx <= s.x + s.w && ty >= s.y - 1 && ty <= s.y + s.h;
    });
    if (mobs.length) spawnMobs++;
  }
  check('f1 doors off spawn', doorBad === 0, doorBad + '/' + floors);
  check('b2 entrance clear', spawnMobs === 0, spawnMobs + '/' + floors);

  // F2 F3 boss chain on depth 5 and 10
  let chainOk = 0, nearBoss = 0, tried = 0;
  for (const d of [5, 10, 15]) {
    g.startFloor(d, true); tried++;
    const c = bossChain(g), s = g.rooms[0];
    const ok = c.blood && c.puzzle && c.puzzle.puzzle && c.room && c.boss && !c.blood.open && !c.puzzle.open;
    if (ok) {
      const hall = Math.abs(c.blood.tiles[0].x - c.puzzle.tiles[0].x) + Math.abs(c.blood.tiles[0].y - c.puzzle.tiles[0].y);
      const far = Math.hypot(c.room.cx - s.cx, c.room.cy - s.cy) >= 14 && hall >= 8;
      const bossIn = Math.floor(c.boss.x / 16) >= c.room.x && Math.floor(c.boss.x / 16) < c.room.x + c.room.w;
      if (far && bossIn) chainOk++; else nearBoss++;
    }
  }
  check('f2 f3 boss hall', chainOk === tried, chainOk + '/' + tried + ' near ' + nearBoss);

  // B1 hazards: no enemy standing on acid/lava after gen
  let hazMobs = 0, hazFloors = 0;
  w.__forceHaz = 'lava';
  for (let d = 7; d <= 9; d++) {
    g.startFloor(d, true); hazFloors++;
    for (const e of g.enemies) if (!e.T.boss && g.lethalFloor(e.x, e.y)) hazMobs++;
  }
  w.__forceHaz = 'acid';
  g.startFloor(8, true); hazFloors++;
  for (const e of g.enemies) if (!e.T.boss && g.lethalFloor(e.x, e.y)) hazMobs++;
  delete w.__forceHaz;
  check('b1 no lava acid spawn', hazMobs === 0, hazMobs + ' on ' + hazFloors);

  // pathing: acid tile is closed on the AI map
  g.startFloor(1, true);
  const p = g.player;
  const tx = Math.floor(p.x / 16), ty = Math.floor(p.y / 16) + 3;
  g.setHaz(tx, ty, 3);
  const M = w.aiMap074();
  check('b1 ai blocks lava', M[ty][tx] === 1, M[ty] && M[ty][tx]);

  // F10 coins
  g.startFloor(3, true);
  const before = g.ground.length;
  w.dropAt(g.ground, p.x + 40, p.y, { gold: 5 });
  const coins = g.ground.filter(o => o.coin && o.gold === 1);
  check('f10 five coins', coins.length >= 5 && g.ground.filter(o => o.gold > 1).length === 0, coins.length + ' piles>' + (g.ground.length - before));
  const c0 = coins[0];
  const x0 = c0.x, y0 = c0.y, bz0 = c0.bz;
  for (let i = 0; i < 6; i++) g.step(0.05, { x: 0, y: 0 });
  check('f10 coins move', c0.settled || Math.hypot(c0.x - x0, c0.y - y0) > 0.5 || c0.bz !== bz0, 'x ' + Math.round(x0) + '->' + Math.round(c0.x) + ' bz ' + bz0 + '->' + c0.bz);

  const src = (function () { try { const x = new XMLHttpRequest(); x.open('GET', '../index.html', false); x.send(null); return x.responseText; } catch (e) { return ''; } })();
  check('f11 rate halved', src.indexOf('gold: .035') >= 0 && src.indexOf('gold: 50 * depth') >= 0, 'see source');

  // F7 necro cap + boss-only flag exists
  check('f7 cap', g.necroCap === 2 && g.necroDrop > 0 && g.necroDrop < 0.6, g.necroCap + ' ' + g.necroDrop);
  p.npPot = 2;
  w.dropAt(g.ground, p.x, p.y, { pot: 'np' });
  const pot = g.ground.find(o => o.pot === 'np');
  if (pot) { pot.lock = false; pot.x = p.x; pot.y = p.y; g.step(0.05, { x: 0, y: 0 }); }
  check('f7 cannot hold 3', p.npPot === 2, p.npPot);

  // F12 shop blind offers
  w.__forceShop = true;
  g.startFloor(10, true);
  check('f12 shop offers', !!(g.shop && g.shop.offers && g.shop.offers.length === 3), g.shop && g.shop.offers && g.shop.offers.map(o => o.label + '@' + o.price).join(' | '));
  const shallow = g.shopUniquePrice(2);
  g.startFloor(25, true);
  const deep = g.shopUniquePrice(2);
  check('f12 depth price', deep > shallow * 1.4, shallow + ' -> ' + deep);
  let sa = 0, sb = 0, na = 0, nb = 0;
  for (let i = 0; i < 12; i++) {
    const a = g.rollShopUnique({ slot: 'weapon', tier: 1, price: shallow });
    const b = g.rollShopUnique({ slot: 'weapon', tier: 4, price: deep });
    if (a && a.max) { sa += a.max; na++; }
    if (b && b.max) { sb += b.max; nb++; }
  }
  check('f12 deeper hits harder', na && nb && (sb / nb) > (sa / na) * 1.15, Math.round(sa / na) + ' vs ' + Math.round(sb / nb));
  // UI shows no stat numbers in the offer button
  if (g.shop && !g.shop.sealed) { w.openShop(); const html = w.document.getElementById('shUni').innerHTML; check('f12 blind ui', html.indexOf('Sealed') >= 0 && !/\d+-\d+/.test(html) && html.indexOf('Damage') < 0, html.replace(/<[^>]+>/g, ' ').slice(0, 180)); w.closeShop && w.closeShop(); }
  else check('f12 blind ui', true, 'sealed shop, offers exist');
  delete w.__forceShop;

  // F5 F6 death + resurrect
  g.startFloor(4, true);
  const px = g.player.x, py = g.player.y;
  g.player.npPot = 0;
  g.die('a bog slime', 'battle');
  check('f6 dying', g.state === 'dying' && g.deathAct && g.deathAct.cause === 'battle' && g.deathAct.dur >= 3 && g.deathAct.dur <= 4, g.state + ' ' + (g.deathAct && g.deathAct.dur));
  for (let i = 0; i < 40; i++) g.step(0.1, { x: 0, y: 0 });
  check('f5 overlay', g.state === 'dead' && w.document.getElementById('deadTitle').textContent === 'YOU HAVE DIED', w.document.getElementById('deadTitle') && w.document.getElementById('deadTitle').textContent);
  const rez = w.document.getElementById('dRez');
  check('f5 rez locked', rez.disabled === true, rez.disabled + ' ' + rez.textContent);
  w.document.getElementById('dRetry');
  // resurrect with a potion: die again
  g.player.npPot = 1; g.player.hp = 0;
  // already dead; set potion and refresh by calling die path via resurrect precondition
  // re-open overlay state: resurrect requires state dead and npPot
  const hp0 = g.player.st.maxHp;
  const ok = g.resurrect();
  check('f5 resurrect', ok === true && g.state === 'play' && g.player.npPot === 0 && Math.abs(g.player.x - px) < 2 && Math.abs(g.player.y - py) < 2 && g.player.hp <= hp0 * 0.5 + 0.2 && g.player.hp >= hp0 * 0.5 - 0.2, 'hp ' + g.player.hp + '/' + hp0 + ' pot ' + g.player.npPot + ' st ' + g.state);

  g.player.hp = 1; g.player.hunger = 0;
  // force starve tick
  const starved = w.updateSurvival(5);
  check('f6 starve cause', g.state === 'dying' && g.deathAct && g.deathAct.cause === 'starve', g.state + ' ' + (g.deathAct && g.deathAct.cause) + ' ret ' + starved);

  g.player.hp = 30; g.player.hunger = 100;
  g.startFloor(4, true);
  w.setState('play');
  g.die('flames', 'fire');
  check('f6 fire cause', g.deathAct && g.deathAct.cause === 'fire', g.deathAct && g.deathAct.cause);

  // dev hud still absent from menu markup
  check('no dev menu row', !w.document.getElementById('mGlDev'));
  check('necro art wired', src.indexOf('item_necro_potion_12') >= 0 && src.indexOf("pot === 'np'") >= 0);
}
</script>
</body>
</html>
